<head>

<title>เส้นทางนักเตะ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1e7;--card:#fff;--ink:#14231a;--mute:#5d6b61;--pitch:#1f5f3a;--gold:#f2c230;--red:#d6453d;--line:#d9d6c5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#182720;--ink:#eef0e6;--mute:#9fb0a4;--line:#2b3d33}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Sarabun',system-ui,sans-serif}
h1,h2{font-family:'Kanit','Sarabun',sans-serif;margin:0}
.top{background:repeating-linear-gradient(90deg,#1f5f3a 0 48px,#256d43 48px 96px);color:#f3f1e7;padding:16px;border-bottom:4px solid var(--gold)}
.top h1{max-width:640px;margin:0 auto;font-size:24px;font-weight:800}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
.card{display:flow-root;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
.row{display:flex;gap:8px 12px;flex-wrap:wrap}.st{flex:1 1 30%;font-size:13px}
.bar{height:7px;background:var(--line);border-radius:4px;margin-top:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pitch)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mute);margin-bottom:8px}.meta b{color:var(--ink)}
button{font:500 16px 'Kanit','Sarabun',sans-serif;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 14px;text-align:left;width:100%;margin-top:8px}
button small{display:block;font:400 14px 'Sarabun',sans-serif;opacity:.85}
button:hover,button.on{background:var(--gold);color:#14231a}button.main{background:var(--pitch);color:#f3f1e7;border-color:var(--pitch)}button.main:hover{background:var(--gold);color:#14231a}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input{font:inherit;width:100%;padding:10px;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink)}
h2{font-size:19px;margin-bottom:4px}p{margin:6px 0}.mu{color:var(--mute)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.log p{padding-left:10px;border-left:3px solid var(--line)}.log .g1{border-color:var(--pitch)}.log .b1{border-color:var(--red)}
.stage{position:relative;height:260px;border-radius:10px;overflow:hidden;background:linear-gradient(#3b0a14 0,#5b1022 55%,#14231a 55%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px}
.spot{position:absolute;top:0;left:50%;width:180px;height:260px;margin-left:-90px;background:linear-gradient(rgba(255,240,170,.55),transparent);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation:sw 3s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.wn{width:84px;position:relative;animation:up 1s ease-out both}@keyframes up{from{transform:translateY(40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.pod{font-size:40px;position:relative;animation:pop 1.2s .6s both}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.pod.lift{animation:lift 1.6s .6s both}@keyframes lift{from{transform:translateY(60px) scale(.3)}60%{transform:translateY(-30px) scale(1.5)}to{transform:translateY(-14px) scale(1.3)}}
.cap{position:relative;color:#f3f1e7;text-align:center;font-family:Kanit,sans-serif;margin-top:4px}.cap small{display:block;color:#f2c230}
.cf{position:absolute;top:-10px;width:6px;height:10px;animation:fl 3s linear infinite}@keyframes fl{to{transform:translateY(280px) rotate(540deg)}}
button{transition:background-color .18s ease,color .18s ease,transform .14s ease,box-shadow .18s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (hover:hover){button:hover{transform:translateY(-1px);box-shadow:0 3px 0 rgba(20,35,26,.25)}}
button:active{transform:translateY(1px) scale(.985);box-shadow:none;background:var(--gold);color:#14231a}
.card{animation:cin .3s ease both}@keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.spot,.cf,.wn,.pod{animation:none}button,.card{transition:none;animation:none}button:hover,button:active{transform:none}}
</style>
</head>

function week(){if(S.wk>=5)return S.tdone?endSeason():tour();S.ap=2;S.pf={};S.fat=cl(S.fat-15,0,100);S.cash=Math.max(0,S.cash+S.wage*10/1e6+S.fol/5e7-TRN[S.tr][1]/1e3);S.mor=cl(S.mor+(S.mate?3:0)+Math.min(S.fr,3),0,100);if(S.wk==0||!S.cal)seas();mail();hub()}
function week2(){
if(Math.random()<.55){var e=EV[rnd(0,EV.length-1)];
return put(head()+'<div class="card"><h2>เหตุการณ์นอกสนาม</h2><p>'+e[0]+'</p>'+B(e[1].map(function(o){return[o[0],function(){fx(o[1]);put(head()+'<div class="card"><p>'+o[2]+'</p>'+B([["ไปต่อ",pre,"","main"]])+'</div>')}]}))+'</div>')}
pre()}
function pre(){var c=CT[S.country].c.filter(function(n){return"อะคาเดมี "+n!==S.club.n&&n!==S.club.n}),os=S.cal[S.wk].s;
m={opp:S.cal[S.wk].o,os:os,i:0,r:6,g:0,a:0,c:0,n:0,pl:0};
var pl=S.role==2?3:S.role==1?2:(Math.random()<.5?1:0);if(S.inj>0)pl=0;m.pl=pl;
put(head()+'<div class="card"><h2>แมตช์ที่ '+(S.wk+1)+'/5</h2><p>พบ <b>'+m.opp+'</b> (ความแรง '+m.os+') · ทีมคุณ '+S.club.s+'</p>'+(S.inj>0?'<p>🩹 คุณบาดเจ็บ ต้องพักอีก '+S.inj+' นัด</p>':'<p class="mu">'+(pl?"คุณอยู่ในรายชื่อ "+R[S.role]+" ตำแหน่ง"+PN[S.pos]+" · ความล้า "+S.fat+"%"+(S.coachMsg?" · 💬 "+S.coachMsg:""):"โค้ชไม่ได้ใส่ชื่อคุณลงสนาม")+'</p>')+B(pb(pl))+'</div>')}
function mom(){if(m.i>=m.pl)return fin();var q=MO[MP[S.pos][rnd(0,4)]],mn=[22,55,78][m.i]+rnd(0,8);
if(S.role<2&&m.i==0)mn=rnd(60,75);
put(head()+'<div class="card"><h2>นาทีที่ '+mn+'</h2>'+pitch(q.x,q.y,mn)+'<p><b>'+q.t+'</b></p>'+B(q.o.map(function(o){return[o[0],function(){act(o,q,mn)},"ความถนัด"+ST[o[1]]+" "+S.s[o[1]]]}))+'</div>')}
function act(o,q,mn){var p=cl(.5+(S.s[o[1]]-o[2])/80+(S.mor-50)/300+(S.cal[S.wk].h?.03:0)-S.fat/400-(m.os-60)/250,.08,.92),ok=Math.random()<p,t=o[3],msg;
if(t=="g"){if(ok){m.g++;m.r+=1.4;msg="⚽ ประตู! สนามระเบิดเสียงเชียร์"}else{m.r-=.2;msg="บอลไปไม่ถึงเป้า ผู้รักษาประตูปัดออก"}}
else if(t=="a"){if(ok&&Math.random()<.75){m.a++;m.r+=1.1;msg="🎯 แอสซิสต์! เพื่อนซัดเข้าไป"}else{m.r-=.1;msg="เพื่อนรับบอลไม่ทัน เสียจังหวะ"}}
else{if(ok){m.r+=.6;msg="🛡️ คุณสกัดไว้ได้ แฟนบอลปรบมือ"}else{m.c++;m.r-=.6;msg="พลาด! คู่แข่งเจาะเข้ามาได้"}}
m.i++;var px=cl(q.x*3,40,270),py=cl(q.y*1.8,30,150),tg,bn,gy=rnd(-9,9),G="#f2c230",K="#14231a",RD="#d6453d";
if(t=="g"){if(ok){tg=[297,90+gy,gy>=0?-12:12];bn=bnr("ประตู!",G,K)}else if(Math.random()<.6){tg=[286,90+gy,gy];bn=bnr("ถูกเซฟ!",RD,"#fff")}else{tg=[297,gy>0?44:136,0];bn=bnr("ยิงข้ามคาน",RD,"#fff")}}
else if(t=="a"){tg=ok?[cl(px-14,14,286),cl(py+44,14,166)]:[px+24,py+14];bn=ok&&msg.indexOf("แอสซิสต์")>0?bnr("แอสซิสต์!",G,K):bnr("จ่ายพลาด",RD,"#fff")}
else{tg=ok?[px-30,py-10]:[px+50,py+10];bn=ok?bnr("สกัดได้!",G,K):bnr("เสียประตู",RD,"#fff")}
put(head()+'<div class="card">'+pitch(q.x,q.y,mn,tg,bn)+'<p><b>'+msg+'</b></p>'+B([["ต่อ",mom,"","main"]])+'</div>')}
function fin(){var ps=m.pl>0,tg=Math.max(0,Math.round(1.1+(S.club.s-m.os)/28+rnd(-1,1)))+m.g+m.a,og=Math.max(0,Math.round(.9+(m.os-S.club.s)/28+rnd(-1,1)))+m.c,r=ps?cl(m.r,4,10):0,res=tg>og?"ชนะ":tg==og?"เสมอ":"แพ้";
S.sea[tg>og?"w":tg==og?"d":"l"]++;S.cal[S.wk].r=tg+"-"+og+" ("+res+")";nw(S.club.n+" "+tg+"-"+og+" "+S.cal[S.wk].o+(m.g?" · "+S.name+" ยิง "+m.g+" ประตู":""));S.goals+=m.g;S.fol+=m.g*rnd(300,900)+(tg>og?200:0);S.ast+=m.a;S.sg+=m.g;S.sa+=m.a;if(ps){S.apps++;S.sp++;S.fat=cl(S.fat+25,0,100);if(Math.random()<.05+S.fat/700){S.inj=rnd(2,4);S.coachMsg="🩹 คุณบาดเจ็บระหว่างเกม พักประมาณ "+(S.inj-1)+" นัด"}}else S.fat=cl(S.fat-15,0,100);if(S.inj>0)S.inj--;
var lg="";if(ps){if(r>=7.5)S.rs=Math.max(S.rs,0)+1;else if(r<5.8)S.rs=Math.min(S.rs,0)-1;
if(S.rs>=2&&S.role<2){S.role++;S.rs=0;lg="⬆️ โค้ชเลื่อนคุณขึ้นเป็น"+R[S.role]}if(S.rs<=-2&&S.role>0){S.role--;S.rs=0;lg="⬇️ คุณถูกลดเหลือ"+R[S.role]}}
var coach=!ps?"วันนี้ไม่ได้ลงสนาม ซ้อมให้หนักแล้วโอกาสจะมา":r>=7.5?"เล่นได้ยอดเยี่ยม ผมอยากให้ทั้งทีมเอาอย่างคุณ":r>=6.3?"เล่นได้ตามมาตรฐาน แต่ยังพัฒนาได้อีก":"เกมนี้ไม่ใช่วันของคุณ มาคุยกันหน่อย";
put(head()+'<div class="card"><h2>จบเกม: '+tg+'-'+og+' ('+res+')</h2><p>'+(ps?'คะแนนฟอร์มของคุณ <b>'+r.toFixed(1)+'</b> · ประตู '+m.g+' · แอสซิสต์ '+m.a:'คุณไม่ได้ลงสนามในแมตช์นี้')+'</p>'+(lg?'<p><b>'+lg+'</b></p>':'')+'</div><div class="card"><h2>คุยกับโค้ช</h2><p>💬 "'+coach+'"</p>'+B([["ขอบคุณครับโค้ช ผมจะพยายามต่อ",function(){fx({mor:4,pass:0});train()},"กำลังใจ +4"],["ผมอยากได้โอกาสมากกว่านี้",function(){if(S.role<2&&Math.random()<.45){S.role++;fx({mor:2});S.coachMsg="โค้ชพยักหน้า จะให้โอกาสมากขึ้น"}else{fx({mor:-6});S.coachMsg="โค้ชไม่พอใจที่คุณเรียกร้อง"}train()},"เสี่ยงได้บทบาทดีขึ้นหรือโดนหมางเมิน"]])+'</div>')}
function train(){var msg=S.coachMsg||"";S.coachMsg="";var yg=S.age<22?1:0,o=Object.keys(ST).map(function(k){return[ST[k]+" ("+S.s[k]+")",function(){var g=Math.max(1,rnd(2,4)+S.tr+yg+(S.mor>75?1:0)-(S.age>30?2:0));fx({[k]:g});S.wk++;week()},"ฝึกเสริมเพื่ออัปเกรด +2 ถึง +5"]});
o.push(["พักฟื้นและใช้เวลากับครอบครัว",function(){fx({mor:10,phys:1});S.wk++;week()},"กำลังใจ +10"]);
put(head()+'<div class="card"><h2>เลือกฝึกซ้อมสัปดาห์นี้</h2>'+(msg?'<p><b>'+msg+'</b></p>':'')+B(o)+'</div>')}
/* ---- จบฤดูกาล ---- */
function endSeason(){var q=S.sea,tb=tbl(),cup=tb.rank==1;if(cup){S.cups++;hon("แชมป์ลีก"+S.club.l);nw(S.club.n+" คว้าแชมป์ลีก"+S.club.l)}
var gr=chkGoal();S.cash+=S.wage*52/1e6;S.age++;S.yrs--;
if(S.age>=30)S.s.phys=cl(S.s.phys-rnd(1,3),15,99);if(S.age>=33){S.s.drib=cl(S.s.drib-2,15,99);S.s.pass=cl(S.s.pass-1,15,99)}
S.hist.push(S.club.n);var rec=q.w+" ชนะ "+q.d+" เสมอ "+q.l+" แพ้";S.sea={w:0,d:0,l:0};S.wk=0;
var last=S.age>=36;
put(head()+'<div class="card"><h2>จบฤดูกาล</h2><p>ผลงานทีม: '+rec+' · อันดับลีก '+tb.rank+'/'+tb.rows.length+'</p><p>'+gr+'</p>'+(S.tres?'<p>'+S.tres+'</p>':'')+(cup?'<p><b>🏆 ทีมคว้าแชมป์!</b></p>':'')+'<p>รายได้ปีนี้ $'+(S.wage*52/1e6).toFixed(2)+'M</p>'+B(last?[["แขวนสตั๊ด",retire,"","main"]]:S.yrs<=0?[["พิจารณาสัญญาฉบับใหม่",function(){sign(false)},"","main"],["แขวนสตั๊ด",retire]]:[["ไปฤดูกาลถัดไป",week,"","main"]])+'</div>')}
function retire(){delG();var sc=S.goals*1.2+S.ast*1.5+S.cups*25+S.cash*3+S.apps*.3,t=sc>420?"ตำนานลูกหนังโลก":sc>260?"ซูเปอร์สตาร์":sc>150?"นักเตะอาชีพเต็มตัว":sc>70?"ตัวหลักที่แฟนบอลจดจำ":"นักเตะผู้เดินตามความฝัน";
put('<div class="card"><h2>แขวนสตั๊ดที่อายุ '+S.age+'</h2><div style="font:800 30px Kanit,sans-serif">'+t+'</div><p class="mu">'+S.name+' ('+PN[S.pos]+', '+S.country+')</p><div class="meta"><span>ลงสนาม <b>'+S.apps+'</b></span><span>ประตู <b>'+S.goals+'</b></span><span>แอสซิสต์ <b>'+S.ast+'</b></span><span>ถ้วย <b>'+S.cups+'</b></span><span>เงินสะสม <b>$'+S.cash.toFixed(1)+'M</b></span></div><p>เส้นทางสโมสร: '+S.hist.filter(function(x,i,a){return a.indexOf(x)==i}).join(" → ")+'</p>'+B([["เริ่มอาชีพใหม่",start,"","main"]])+'</div>')}
start();
</script>
